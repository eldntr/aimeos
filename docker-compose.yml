services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - reborns-network
        depends_on:
            - mysql
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
    app-setup:
        image: sail-8.4/app
        depends_on:
            - laravel.test
            - mysql
        volumes:
            - '.:/var/www/html'
        environment:
            - WWWUSER=${WWWUSER}
        command: "php artisan db:seed --force"
        networks:
            - sail
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
    mysql:
        image: 'mysql/mysql-server:8.0'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    memory: 1500M
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    mailhog:
        image: 'mailhog/mailhog:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

networks:
    sail:
        driver: bridge
    reborns-network:
        external: true
volumes:
    sail-mysql:
        driver: local
