services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    app-setup:
        image: sail-8.4/app
        depends_on:
            - laravel.test
            - mysql
        volumes:
            - '.:/var/www/html'
        environment:
            - WWWUSER=${WWWUSER}
        command: "php artisan db:seed --force"
        networks:
            - sail
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    rabbitmq:
        image: rabbitmq:3.12-management
        container_name: postal_rabbitmq
        restart: always
        environment:
            RABBITMQ_DEFAULT_USER: postal
            RABBITMQ_DEFAULT_PASS: postal_password
            RABBITMQ_DEFAULT_VHOST: postal
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - sail

    mariadb:
        image: mariadb:10.11
        container_name: postal_mariadb
        restart: always
        environment:
            MARIADB_ROOT_PASSWORD: postal_root_password
            MARIADB_DATABASE: postal
            MARIADB_USER: postal
            MARIADB_PASSWORD: postal_password
        volumes:
            - mariadb_data:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - sail

    postal-web:
        image: ghcr.io/postalserver/postal:latest
        container_name: postal_web
        restart: always
        command: postal web-server
        depends_on:
            - mariadb
            - rabbitmq
        volumes:
            - ./docker/postal/config:/config
        ports:
            - "5000:5000"
        networks:
            - sail

    postal-runner:
        image: ghcr.io/postalserver/postal:latest
        container_name: postal_runner
        restart: always
        command: postal smtp-server
        depends_on:
            - mariadb
            - rabbitmq
            - postal-web
        volumes:
            - ./docker/postal/config:/config
        ports:
            - "2525:25"
        networks:
            - sail

    postal-worker:
        image: ghcr.io/postalserver/postal:latest
        container_name: postal_worker
        restart: always
        command: postal worker
        depends_on:
            - mariadb
            - rabbitmq
            - postal-web
        volumes:
            - ./docker/postal/config:/config
        networks:
            - sail

    postal-setup:
        image: ghcr.io/postalserver/postal:latest
        container_name: postal_setup
        depends_on:
            - mariadb
            - rabbitmq
        volumes:
            - ./docker/postal/config:/config
        command: sh -c "postal initialize && postal console < /config/postal-setup.rb"
        networks:
            - sail



networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    rabbitmq_data:
        driver: local
    mariadb_data:
        driver: local
